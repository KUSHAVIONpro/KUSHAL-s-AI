<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>KUSHAL'S AI</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
}

body{
    background:#05050d;
    color:#f5f5f5;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}


/* =========================================================
   MAIN APP
========================================================= */

.app{
    width:100%;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    background:
        radial-gradient(
            circle at 50% -20%,
            rgba(0,180,255,.12),
            transparent 40%
        ),
        #05050d;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    flex-shrink:0;
    text-align:center;
    padding:
        18px
        12px
        16px;

    border-bottom:
        1px solid
        #00bfe8;
}

.logo{
    font-size:
        clamp(38px,9vw,68px);

    font-weight:
        900;

    line-height:
        1.05;

    color:
        #00d9ff;

    text-shadow:
        0 0 8px #00d9ff,
        0 0 20px #00b7ff,
        0 0 40px #0077ff;
}

.subtitle{
    margin-top:
        8px;

    font-size:
        clamp(18px,5vw,28px);

    color:
        #aaa;

    letter-spacing:
        .3px;
}


/* =========================================================
   CHAT
========================================================= */

.chat{
    flex:
        1;

    overflow-y:
        auto;

    padding:
        20px
        14px
        160px;

    scroll-behavior:
        smooth;
}

.chat::-webkit-scrollbar{
    width:5px;
}

.chat::-webkit-scrollbar-thumb{
    background:#08758c;
    border-radius:20px;
}


/* =========================================================
   MESSAGE
========================================================= */

.message{
    width:
        100%;

    max-width:
        850px;

    margin:
        12px auto;

    padding:
        16px 17px;

    border-radius:
        18px;

    font-size:
        17px;

    line-height:
        1.6;

    white-space:
        pre-wrap;

    overflow-wrap:
        anywhere;

    animation:
        appear .2s ease;
}

@keyframes appear{
    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.ai{
    background:
        rgba(23,23,39,.96);

    border:
        1px solid
        #075d73;
}

.user{
    background:
        rgba(5,62,76,.95);

    border:
        1px solid
        #00bddd;

    margin-left:
        auto;

    width:
        85%;
}


/* =========================================================
   BOTTOM CONTROLS
========================================================= */

.bottom{
    position:
        fixed;

    left:
        0;

    right:
        0;

    bottom:
        0;

    z-index:
        100;

    padding:
        8px
        10px
        12px;

    background:
        rgba(7,7,17,.98);

    border-top:
        1px solid
        #126278;

    backdrop-filter:
        blur(12px);
}

.status{
    text-align:
        center;

    color:
        #00d9ff;

    font-size:
        19px;

    margin-bottom:
        8px;
}

.inputRow{
    width:
        100%;

    max-width:
        900px;

    margin:
        auto;

    display:
        flex;

    align-items:
        center;

    gap:
        7px;
}


/* =========================================================
   INPUT
========================================================= */

#question{
    min-width:
        0;

    flex:
        1;

    height:
        55px;

    padding:
        0 18px;

    border:
        1.5px solid
        #00c9e8;

    border-radius:
        30px;

    outline:
        none;

    background:
        #10101d;

    color:
        white;

    font-size:
        17px;
}

#question::placeholder{
    color:
        #888;
}

#question:focus{
    border-color:
        #00e5ff;

    box-shadow:
        0 0 12px
        rgba(0,220,255,.18);
}


/* =========================================================
   BUTTONS
========================================================= */

.controlBtn{
    flex:
        0 0 54px;

    width:
        54px;

    min-width:
        54px;

    height:
        54px;

    border:
        1px solid
        #00c9e8;

    border-radius:
        50%;

    background:
        #08bddb;

    color:
        #001017;

    font-size:
        24px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    cursor:
        pointer;

    user-select:
        none;
}

.controlBtn:active{
    transform:
        scale(.91);
}


/* =========================================================
   EXTRA BUTTONS
========================================================= */

.tools{
    max-width:
        900px;

    margin:
        8px auto 0;

    display:
        flex;

    justify-content:
        center;

    gap:
        7px;
}

.tool{
    background:
        #10101d;

    border:
        1px solid
        #164e5d;

    color:
        #9ceeff;

    border-radius:
        15px;

    padding:
        6px 11px;

    font-size:
        12px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:430px){

    .header{
        padding-top:
            14px;

        padding-bottom:
            13px;
    }

    .logo{
        font-size:
            39px;
    }

    .subtitle{
        font-size:
            18px;
    }

    .chat{
        padding:
            15px
            10px
            155px;
    }

    .message{
        font-size:
            16px;

        padding:
            14px;
    }

    .user{
        width:
            88%;
    }

    .bottom{
        padding:
            7px
            8px
            10px;
    }

    .status{
        font-size:
            17px;
    }

    .inputRow{
        gap:
            6px;
    }

    #question{
        height:
            53px;

        font-size:
            16px;

        padding:
            0 15px;
    }

    .controlBtn{
        flex-basis:
            52px;

        width:
            52px;

        min-width:
            52px;

        height:
            52px;

        font-size:
            22px;
    }

    .tools{
        display:
            none;
    }
}

</style>
</head>

</div>

/* =========================================================
   NORMALIZE
========================================================= */

function normalize(text){

    return text
    .toLowerCase()
    .replace(/[?!,.:;]/g," ")
    .replace(/\s+/g," ")
    .trim();

}



/* =========================================================
   FIND CHAPTER
========================================================= */

function findChapter(text){

    const q=normalize(text);

    for(const key in ALIASES){

        if(q.includes(key.toLowerCase())){

            const number=ALIASES[key];

            return Object.keys(MATHS)[number-1];

        }

    }

    return null;

}
